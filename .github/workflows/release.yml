# Publishes a GitHub release when a milestone is closed.
#
# Close a milestone named like "v1.1" and this workflow will:
#   1. check that the milestone has no open issues left
#   2. set "Version" in crisp-todo/metadata.json to 1.1 and commit it
#   3. build crisp-todo-v1.1.plasmoid
#   4. create the v1.1 tag and a release with the .plasmoid attached and
#      the milestone's closed issues as release notes
#
# It can also be started by hand from the Actions tab (e.g. to retry).

name: Release

on:
  milestone:
    types: [closed]
  workflow_dispatch:
    inputs:
      milestone:
        description: "Milestone title to release (e.g. v1.1)"
        required: true

permissions:
  contents: write
  issues: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Passed through env (never pasted into the script) so a strange
      # milestone title can't inject shell commands.
      MILESTONE: ${{ github.event.milestone.title || inputs.milestone }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Work out the version
        id: version
        run: |
          if [[ ! "$MILESTONE" =~ ^v?([0-9]+(\.[0-9]+){0,2})$ ]]; then
            echo "::notice::Milestone '$MILESTONE' doesn't look like a version (v1.2), so no release was made."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${BASH_REMATCH[1]}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Make sure the release doesn't exist yet
        if: steps.version.outputs.skip == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi

      - name: Make sure the milestone is finished
        if: steps.version.outputs.skip == 'false'
        run: |
          open=$(gh issue list --milestone "$MILESTONE" --state open --limit 200 --json number --jq 'length')
          if [ "$open" -gt 0 ]; then
            echo "::error::Milestone '$MILESTONE' still has $open open issue(s). Close or move them, then run this workflow again."
            exit 1
          fi

      - name: Set the version in metadata.json
        if: steps.version.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'EOF'
          import json, os, re
          path = "crisp-todo/metadata.json"
          text = open(path, encoding="utf-8").read()
          new = re.sub(r'("Version"\s*:\s*")[^"]*(")', r"\g<1>" + os.environ["VERSION"] + r"\g<2>", text, count=1)
          json.loads(new)  # fail early if the file is broken
          open(path, "w", encoding="utf-8").write(new)
          EOF
          if git diff --quiet; then
            echo "Version is already $VERSION."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Set version to $VERSION"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi

      - name: Build the .plasmoid package
        if: steps.version.outputs.skip == 'false'
        id: build
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          file="crisp-todo-$TAG.plasmoid"
          # A .plasmoid is a zip with metadata.json at the top level.
          (cd crisp-todo && zip -r -X "../$file" . -x '*.swp' '*~' '.directory')
          unzip -l "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        if: steps.version.outputs.skip == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "## What's new"
            echo
            gh issue list --milestone "$MILESTONE" --state closed --limit 200 \
              --json number,title --jq 'sort_by(.number) | .[] | "- \(.title) (#\(.number))"'
            echo
            echo "## Install"
            echo
            echo "Download \`crisp-todo-$TAG.plasmoid\` below, then either:"
            echo
            echo "- run \`kpackagetool5 -t Plasma/Applet -i crisp-todo-$TAG.plasmoid\`"
            echo "  (use \`-u\` instead of \`-i\` to update an existing install), or"
            echo "- right-click the desktop, choose **Add Widgets** → **Get New Widgets** → **Install Widget From Local File**."
            echo
            echo "Requires KDE Plasma 5."
          } > notes.md
          cat notes.md

      - name: Create the release
        if: steps.version.outputs.skip == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          FILE: ${{ steps.build.outputs.file }}
        run: |
          gh release create "$TAG" "$FILE" \
            --target "$(git rev-parse HEAD)" \
            --title "Crisp Todo $TAG" \
            --notes-file notes.md
